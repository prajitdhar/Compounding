[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compounding-research"
version = "0.4.0"
description = "Shared utilities for corpus preprocessing and compound analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
preprocessing = [
  "duckdb>=1.5", "pyarrow>=14", "numpy>=1.24", "pandas>=2.0",
]
coha = [
  "duckdb>=1.5", "pyarrow>=14", "numpy>=1.24", "pandas>=2.0", "spacy>=3.7",
]
compositionality = [
  "duckdb>=1.5", "pyarrow>=14", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10",
]
novel = [
  "duckdb>=1.5", "pyarrow>=14", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10",
  "scikit-learn>=1.3", "torch>=2.6",
]
ner = ["spacy>=3.7"]
all = [
  "duckdb>=1.5", "pyarrow>=14", "numpy>=1.24", "pandas>=2.0", "scipy>=1.10",
  "scikit-learn>=1.3", "torch>=2.6", "spacy>=3.7",
]

[tool.setuptools]
packages = ["src"]
include-package-data = false

