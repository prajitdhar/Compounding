name: Source checks
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [preprocessing, 'coha,compositionality', compositionality, novel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[${{ matrix.extra }}]'
      - run: python -m unittest discover -s tests -v
      - if: matrix.extra == 'preprocessing'
        run: python -m unittest discover -s google_preprocessing/tests -v
      - if: matrix.extra == 'coha,compositionality'
        run: |
          python -m unittest discover -s coha_preprocessing/tests -v
          python -m unittest discover -s compositionality_over_time/tests -p 'test_coha_features.py' -v
      - if: matrix.extra == 'compositionality'
        run: python -m unittest discover -s compositionality_over_time/tests -v
      - if: matrix.extra == 'novel'
        run: python -m unittest discover -s novel_compound_predictor/tests -v

